name: Deploy PTU cost planner

on:
  push:
    branches:
      - typescript
    paths:
      - "**"
      - ".github/workflows/ptu-cost-compare-AutoDeployTrigger-26071985-3ddf-409a-bc74-89100b842651.yml"
  workflow_dispatch:

concurrency:
  group: ptu-cost-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PTUCOSTCOMPARE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PTUCOSTCOMPARE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PTUCOSTCOMPARE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ptucostcompare
          imageToBuild: ptucostcompare.azurecr.io/ptu-cost-compare:${{ github.sha }}
          containerAppName: ptu-cost-compare
          resourceGroup: minggu-VM
          targetPort: 8501
          ingress: internal
